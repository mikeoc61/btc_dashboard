[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-dashboard"
version = "0.1.0"
description = "BTC-focused analytics: on-chain history, live node, price/SMA, ETF flows, and LLM ad-hoc analysis."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "duckdb>=1.1",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27", "python-multipart>=0.0.9"]
# python-multipart is not optional: FastAPI needs it to parse the ask
# form, and without it the only interactive control on the page 500s.
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
btc-dashboard = "btc_dashboard.cli:main"
btc-dashboard-web = "btc_dashboard.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
